[package]
name = "iridium-mail-ui-egui"
description = "Mail's desktop user interface on egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
iridium-mail-geom.workspace = true
iridium-mail-model.workspace = true
iridium-mail-mime.workspace = true
iridium-mail-fonts.workspace = true
iridium-mail-html.workspace = true
iridium-mail-layout.workspace = true
iridium-mail-engine.workspace = true
egui.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# SVG rasterising for the app icon (Apache-2.0 OR MIT; same version egui_extras' svg loader uses).
resvg.workspace = true
# PNG / JPEG / GIF decoding for contact pictures and pictures in message bodies (MIT OR Apache-2.0).
image.workspace = true
base64.workspace = true

# Downloading remote pictures in message bodies (native only: the browser build has no sockets or threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iridium-mail-net.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
iridium-mail-testmail.workspace = true
iridium-mail-smime = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
