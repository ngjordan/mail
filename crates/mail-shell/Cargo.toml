[package]
name = "iridium-mail-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Mail desktop shell: the app's window logic as a library, driven by apps/iridium-mail and by the Office suite"

[lints]
workspace = true

[dependencies]
iridium-mail-engine.workspace = true
iridium-mail-ui-egui.workspace = true
# Family names of installed fonts (the compose Font list).
iridium-mail-fonts.workspace = true
egui.workspace = true
log.workspace = true
# Native open/save/folder dialogs (MIT).
rfd.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# wgpu as a second renderer (IRIDIUM_MAIL_RENDERER=wgpu): Direct3D 12 on Windows, Vulkan or Metal elsewhere.
# The workspace's eframe has the glow feature, because the app's own binary
# offers the OpenGL renderer. The shell does not: a browser tab has no GL
# context, and the feature changes eframe's on_exit signature. `wgpu` is the
# second renderer (IRIDIUM_MAIL_RENDERER=wgpu): Direct3D 12 on Windows, Vulkan
# or Metal elsewhere.
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wayland", "x11", "accesskit", "links", "clipboard", "wgpu"] }
# HTML and pictures on the system clipboard (rich paste into compose).
arboard.workspace = true
# Encodes clipboard pictures (RGBA) as PNG for the compose editor; decodes portal screenshots.
image.workspace = true

# Screen capture (Insert › Screenshot): X11 and the desktop portal.
# The browser build: eframe without the glow feature, because a browser tab
# has no GL context and the feature changes eframe's on_exit signature. The
# `wgpu` feature is what gives the web runner its renderer; without it eframe
# does not compile for wasm at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu", "accesskit", "links", "clipboard"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true
zbus.workspace = true

# Screen capture (Insert › Screenshot).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap.workspace = true

[dev-dependencies]
tempfile.workspace = true
