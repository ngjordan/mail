[package]
name = "iridium-mail-engine"
description = "Mail engine: session, undo, command registry, feature catalog, sample mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Tests only: a change record that disagrees with the whole-mailbox comparison fails the test instead of
# being logged (`changes.rs`). The engine's own dev-dependency on itself turns it on for its integration tests.
strict-change-check = []
# `Session::queue_imap_results`: IMAP results made up without a server, for `apps/iridium-mail-bench` only. Never
# enabled by the app, CLI or MCP builds (it injects deltas, `reset` and vanished UIDs as if a server sent them).
synthetic-sync = []

[dependencies]
iridium-mail-geom.workspace = true
iridium-mail-mime.workspace = true
iridium-mail-model.workspace = true
iridium-mail-store.workspace = true
iridium-mail-html.workspace = true
iridium-mail-layout.workspace = true
iridium-mail-fonts.workspace = true
iridium-mail-proof.workspace = true
iridium-mail-formats.workspace = true
iridium-mail-search.workspace = true
iridium-mail-render.workspace = true
iridium-mail-smime.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
zeroize.workspace = true

# Protocol clients and the sync worker threads: native only (the browser build has no sockets or threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iridium-mail-net.workspace = true
tempfile.workspace = true

[dev-dependencies]
iridium-mail-engine = { workspace = true, features = ["strict-change-check"] }
proptest.workspace = true
tempfile.workspace = true
iridium-mail-testmail.workspace = true
iridium-mail-smime = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
